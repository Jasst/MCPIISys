worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Явный IPv4 адрес хоста из Docker Desktop (проверено через getent ahosts).
    # host.docker.internal резолвится и в IPv6 (fdc4:...), до которого нет маршрута.
    upstream app_backend {
        server 192.168.65.254:8000;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # HTTP -> HTTPS
    server {
        listen 80;
        server_name blockcoin.ru www.blockcoin.ru blockchat.ru www.blockchat.ru;

        location ^~ /.well-known/acme-challenge/ {
            root /usr/share/nginx/html;
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS
    server {
        listen 443 ssl;
        server_name blockcoin.ru www.blockcoin.ru blockchat.ru www.blockchat.ru;

        ssl_certificate     /etc/nginx/ssl/blockcoin.ru-chain.pem;
        ssl_certificate_key /etc/nginx/ssl/blockcoin.ru-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout 5m;

        client_max_body_size 20M;

        # Сканерные и служебные пути не доходят до приложения
        location ~ /\.(?!well-known) { return 404; }
        location ~* \.(php|asp|aspx|jsp|cgi)$ { return 404; }

        # /mcp без слеша: внутренне переписываем на /mcp/ (без 307 и без http:// в Location)
        location = /mcp {
            rewrite ^ /mcp/ last;
        }

        # Потоковый ответ ИИ: без буферизации
        location ^~ /ai/chat {
            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 3600s;
            proxy_connect_timeout 60s;
        }

        # MCP для внешних ИИ. Заголовки личности сбрасываем: их задаёт только login(code) на сервере
        location ^~ /mcp {
            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-Id "";
            proxy_set_header X-Gateway-Secret "";
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 3600s;
        }

        # Всё остальное: интерфейс, API, картинки, /health
        location / {
            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Connection '';
            proxy_read_timeout 600s;
            proxy_connect_timeout 60s;
        }
    }
}