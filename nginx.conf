worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Имя апстрима на хосте: в Docker Desktop (Windows) host.docker.internal указывает на хост
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # HTTP -> HTTPS
    server {
        listen 80;
        server_name blockcoin.ru www.blockcoin.ru;   # <-- замените на свой домен

        location ^~ /.well-known/acme-challenge/ {
            root /usr/share/nginx/html;
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS: blockcoin.ru
    server {
        listen 443 ssl;
        server_name blockcoin.ru www.blockcoin.ru;   # <-- замените на свой домен

        ssl_certificate     /etc/nginx/ssl/blockcoin.ru-chain.pem;
        ssl_certificate_key /etc/nginx/ssl/blockcoin.ru-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout 5m;

        # Фото в чате уходят base64 в JSON: ~8 МБ файл даёт ~11 МБ тела
        client_max_body_size 20M;

        # Потоковый ответ ИИ: без буферизации, таймаут не меньше STREAM_TIMEOUT (2700 с)
        location ^~ /ai/chat {
            proxy_pass http://host.docker.internal:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 3600s;
            proxy_connect_timeout 60s;
        }

        # MCP для внешних ИИ. Личность задаётся только login(code) внутри сервера:
        # заголовки, которые можно подделать, снаружи сбрасываем.
        location ^~ /mcp {
            proxy_pass http://host.docker.internal:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-Id "";
            proxy_set_header X-Gateway-Secret "";
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 3600s;
        }

        # Всё остальное: интерфейс, API, картинки, /health
        location / {
            proxy_pass http://host.docker.internal:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Connection '';
            proxy_read_timeout 600s;
            proxy_connect_timeout 60s;
        }
    }
}