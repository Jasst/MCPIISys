<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
  <title>Вход — AI-ассистент</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: var(--bg-primary); }
    .login-card {
      width: min(360px, 100%); padding: 28px 24px; border-radius: 18px; background: var(--bg-secondary);
      border: 1px solid var(--border-color); box-shadow: var(--shadow-xl); color: var(--text-main);
    }
    .login-card h1 { margin: 0 0 6px; font-size: 20px; font-weight: 650; }
    .login-card p { margin: 0 0 18px; color: var(--text-muted); font-size: 14px; }
    .login-card input {
      width: 100%; box-sizing: border-box; padding: 11px 13px; border-radius: 10px; font: inherit; font-size: 15px;
      border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-main); outline: none;
    }
    .login-card input:focus { border-color: var(--border-focus); }
    .login-card button {
      width: 100%; margin-top: 12px; padding: 11px; border: none; border-radius: 10px; cursor: pointer;
      background: var(--accent-gradient); color: #fff; font: inherit; font-size: 15px; font-weight: 600;
    }
    .login-card button:disabled { opacity: .5; cursor: default; }
    .login-err { min-height: 18px; margin-top: 10px; font-size: 13px; color: #ffb3b0; }
  </style>
</head>
<body>
<div class="login-wrap">
  <form class="login-card" id="form">
    <h1>Вход</h1>
    <p>Введите пароль, чтобы открыть ассистента.</p>
    <input type="password" id="password" placeholder="Пароль" autocomplete="current-password" autofocus required>
    <button type="submit" id="btn">Войти</button>
    <div class="login-err" id="err"></div>
  </form>
</div>
<script>
  const form = document.getElementById('form');
  const err = document.getElementById('err');
  const btn = document.getElementById('btn');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    btn.disabled = true;
    try {
      const r = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ password: document.getElementById('password').value }),
      });
      if (r.ok) { location.href = '/'; return; }
      const j = await r.json().catch(() => ({}));
      err.textContent = j.detail || 'Не удалось войти';
    } catch {
      err.textContent = 'Нет связи с сервером';
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
